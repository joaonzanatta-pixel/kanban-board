<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simple Kanban Board</h1>
        <div class="board">
            <div class="list" id="list1">
                <h2>To do</h2>
                <div class="card" draggable="true" id="card1">Wash Dishes</div>
                 <div class="card" draggable="true" id="card2">Buy fruts</div>
            </div>
            <div class="list" id="list2">
                <h2>In progress</h2>
                <div class="card" draggable="true" id="card3">Take a shower</div>
            </div>
            <div class="list" id="class3">
                <h2>Done</h2>
                <div class="card" draggable="true" id="card4">Take the dog to walk out</div>
            </div>
        </div>
    </div>
    <script src="scrpit.js"></script>
</body>
</html>
